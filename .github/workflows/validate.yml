# GitHub Action para validar a skill KEE
name: validate-kee
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate syntax
        run: python -c "import py_compile; py_compile.compile('src/baixar-knowhow.py', doraise=True); print('OK')"
      - name: Validate skill.json
        run: python -c "import json; json.load(open('skill.json')); print('skill.json OK')"